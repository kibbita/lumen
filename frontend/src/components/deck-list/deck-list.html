<div class="deck-header">

<h1 class="lumen-font">YOUR DECKS</h1>
  <div tuiButtonGroup>
    <button
      type="button"
      style="color: var(--tui-status-positive); margin-top: 1rem"
      (click)="navigateTo('card-new')"
    >
      <tui-icon icon="@tui.circle-plus" />
      <span class="lumen-font-small" style="margin-top: 0.25rem;"> New Deck / Card </span>
    </button>
  </div>
</div>

<tui-textfield>
    <label tuiLabel for="search">Search</label>
    <input placeholder="Search decks" tuiTextfield type="text" id="search" [(ngModel)]=search/>
    <tui-icon icon="@tui.search"></tui-icon>
</tui-textfield>

<div class="deck-grid" style="margin-top: 2rem;">

  @for (deck of decks(); track deck.id) {
    <app-deck-component [deck]="deck" style="margin-right: 1rem; margin-bottom: 2rem;"></app-deck-component>
  }
</div>
